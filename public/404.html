<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J/Kopay Christian College</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    // Single Page Apps for GitHub Pages / Static Hosting
    // Redirects 404s to index.html preserving path for BrowserRouter
    const path = window.location.pathname;
    const query = window.location.search;
    const hash = window.location.hash;
    sessionStorage.setItem('redirect_path', path + query + hash);
    window.location.replace('/');
  </script>
</head>

</html>
